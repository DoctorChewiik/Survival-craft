name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: survivalcraft-jar
          path: build/libs/*.jar

      # Publie le dernier .jar sur une pré-version "dev" : lien de téléchargement direct, sans connexion
      - name: Publish dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev build/libs/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Version de test (${GITHUB_REF_NAME})" \
            --notes "Dernière version compilée automatiquement depuis la branche ${GITHUB_REF_NAME}. Mettre le .jar dans le dossier mods (NeoForge 1.21.1)."
